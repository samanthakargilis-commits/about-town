name: Daily events

on:
  schedule:
    - cron: "15 13 * * *"     # 6:15am Pacific (PDT)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated adapters to run (blank = all)"
        required: false
      inspect:
        description: "URLs to inspect (space-separated), for fixing an adapter"
        required: false
  push:
    branches: [main, "v1-*", "v2-*"]
  issues:
    types: [opened, closed, reopened]   # a source added (or dropped), or taste sent for the calendars, shows up without waiting a day

permissions:
  contents: write
  issues: read

concurrency:
  # one run at a time per branch; work branches publish to their own preview branch,
  # so they no longer queue behind (and cancel) each other or main
  group: daily-events-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'issues' || (startsWith(github.event.issue.title, 'Add source') || startsWith(github.event.issue.title, 'Calendar taste')) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Restore page + AI cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ingest-${{ github.run_id }}
          restore-keys: ingest-

      - name: Inspect pages
        if: ${{ github.event.inputs.inspect || hashFiles('tools/inspect-urls.txt') != '' }}
        run: python tools/inspect_page.py ${{ github.event.inputs.inspect }} $(cat tools/inspect-urls.txt 2>/dev/null) | tee app/inspect.txt

      - name: Sources added and calendar taste sent in the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > requests.json || echo "[]" > requests.json

      - name: Gather events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          ARGS="--previous https://${OWNER,,}.github.io/${NAME}/events.json"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python -m ingest $ARGS 2>&1 | tee app/run-log.txt
          python tools/summary.py app/events.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: events
          path: app/events.json

      - name: Publish app + events to the gh-pages branch
        run: |
          cd app
          touch .nojekyll
          git init -q -b site
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Events for $(date -u +%F) from ${GITHUB_SHA::7}"
          # only main publishes the live app; work branches publish to a preview branch
          TARGET=gh-pages
          if [ "${GITHUB_REF_NAME}" != "main" ]; then TARGET="preview-${GITHUB_REF_NAME}"; fi
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET}"
