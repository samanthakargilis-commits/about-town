name: Daily events

on:
  schedule:
    - cron: "15 13 * * *"     # 6:15am Pacific (PDT)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated adapters to run (blank = all)"
        required: false
      inspect:
        description: "URLs to inspect (space-separated), for fixing an adapter"
        required: false
  push:
    branches: [main, "v1-*"]

permissions:
  contents: write

concurrency:
  group: daily-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Restore page + AI cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ingest-${{ github.run_id }}
          restore-keys: ingest-

      - name: Inspect pages
        if: ${{ github.event.inputs.inspect || hashFiles('tools/inspect-urls.txt') != '' }}
        run: python tools/inspect_page.py ${{ github.event.inputs.inspect }} $(cat tools/inspect-urls.txt 2>/dev/null)

      - name: Gather events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          ARGS="--previous https://${OWNER,,}.github.io/${NAME}/events.json"
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          python -m ingest $ARGS
          python tools/summary.py app/events.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: events
          path: app/events.json

      - name: Publish app + events to the gh-pages branch
        run: |
          cd app
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Events for $(date -u +%F) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
